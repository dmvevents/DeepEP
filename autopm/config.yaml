# autopm/config.yaml
repo_root: ".."
branch_prefix: "autopm/"
model_provider: "anthropic"   # or "openai"
model: "claude-3-5-sonnet-20241022"
temperature: 0.2
max_output_tokens: 3000
watch_ignore_globs:
  - "node_modules/**"
  - ".venv/**"
  - "autopm/out/**"
personas:
  pm: {enabled: true, weight: 1.0}
  uiux: {enabled: true, weight: 1.0}
  react: {enabled: true, weight: 1.0}
  django: {enabled: true, weight: 1.0}
  owner: {enabled: true, weight: 0.6}
  qa: {enabled: true, weight: 0.8}
security_gates:
  enforce_pii_encryption: true
  enforce_audit_events: true
git:
  enforce_author_name: "Anton Alexander"
  # email pulled from local `git config user.email`
