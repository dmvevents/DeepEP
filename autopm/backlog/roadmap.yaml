# Derived from PM brief (phases condensed to epics)
epics:
  - key: PHASE1
    title: Harden Intake & Credit
    branches: ["frontend/intake", "backend/credit", "ai/credit-normalization"]
    acceptance:
      - "Full purchase path to credit snapshot"
      - "Per-debt confirm/dispute works; doc tasks auto-create"
      - "Mortgage checks trigger prompts & tasks"
      - "PII encrypted at rest; SSN masked; access logs"
  - key: PHASE2
    title: Docs, OCR, Income Calc & LO Console
    branches: ["frontend/docs-portal", "backend/income", "ai/ocr"]
    acceptance:
      - "Upload→OCR→structured values; income calc draft visible"
      - "Rules toggles update DTI instantly"
      - "Doc task lifecycle complete"
  - key: PHASE3
    title: Pre-Approval + Scenario Desk
    branches: ["frontend/scenario-desk", "backend/fee-pricing", "backend/dti"]
    acceptance:
      - "3 scenarios with Rate/Points or Lender Credit"
      - "PDF Loan Cost Estimate with watermark"
      - "Share-to-realtor with audit event"
  - key: PHASE4
    title: Portal Polish, Performance, White-Label
    branches: ["frontend/portal-polish", "platform/tenant-theming", "ops/observability"]
    acceptance:
      - "Role-based access incl. Realtor"
      - "Tenant theming"
      - "Logs/metrics/errors + runbooks"
