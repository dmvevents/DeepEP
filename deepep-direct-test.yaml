apiVersion: v1
kind: Pod
metadata:
  name: deepep-node0
  labels:
    app: deepep-test
    node: "0"
spec:
  restartPolicy: Never
  volumes:
  - name: test-files
    configMap:
      name: deepep-test-files
  - name: dev-shm
    emptyDir:
      medium: Memory
      sizeLimit: 32Gi
  - name: dev-infiniband
    hostPath:
      path: /dev/infiniband
  - name: dev-gdrdrv
    hostPath:
      path: /dev/gdrdrv
  containers:
  - name: test
    image: 058264135704.dkr.ecr.us-east-2.amazonaws.com/deepep-efa-h100:latest
    workingDir: /workspace/DeepEP
    securityContext:
      privileged: true
      capabilities:
        add: [IPC_LOCK, SYS_RESOURCE, SYS_PTRACE]
    volumeMounts:
    - name: test-files
      mountPath: /workspace/DeepEP/tests/utils.py
      subPath: utils.py
    - name: test-files
      mountPath: /workspace/DeepEP/tests/test_low_latency.py
      subPath: test_low_latency.py
    - name: dev-shm
      mountPath: /dev/shm
    - name: dev-infiniband
      mountPath: /dev/infiniband
    - name: dev-gdrdrv
      mountPath: /dev/gdrdrv
    env:
    - name: LD_LIBRARY_PATH
      value: "/opt/amazon/aws-ofi-nccl/lib:/opt/amazon/efa/lib:/opt/amazon/openmpi/lib:/opt/nccl/build/lib:/opt/gdrcopy/lib:/usr/local/cuda/compat/lib.real:/usr/local/cuda/lib64"
    - name: PATH
      value: "/opt/amazon/efa/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    - name: PYTHONPATH
      value: "/workspace/DeepEP/tests:/workspace/DeepEP"
    - name: NVSHMEM_REMOTE_TRANSPORT
      value: "libfabric"
    - name: NVSHMEM_LIBFABRIC_PROVIDER
      value: "efa"
    - name: FI_PROVIDER
      value: "efa"
    - name: FI_EFA_USE_DEVICE_RDMA
      value: "1"
    - name: FI_EFA_FORK_SAFE
      value: "1"
    - name: RDMAV_FORK_SAFE
      value: "1"
    - name: NCCL_DEBUG
      value: "INFO"
    - name: NCCL_NET_GDR_LEVEL
      value: "5"
    - name: NCCL_NET_GDR_READ
      value: "1"
    - name: MASTER_ADDR
      value: "deepep-node0"  # Will resolve to this pod's IP
    - name: MASTER_PORT
      value: "29500"
    - name: WORLD_SIZE
      value: "2"
    - name: RANK
      value: "0"
    resources:
      limits:
        nvidia.com/gpu: 8
        vpc.amazonaws.com/efa: 32
        hugepages-2Mi: 5120Mi
        cpu: "90"
        memory: "768Gi"
      requests:
        nvidia.com/gpu: 8
        vpc.amazonaws.com/efa: 32
        hugepages-2Mi: 5120Mi
        cpu: "90"
        memory: "768Gi"
    command:
    - /bin/bash
    - -c
    - |
      echo "🚀 DeepEP Node 0 - RANK=$RANK"
      echo "MASTER_ADDR: $MASTER_ADDR"
      echo "Waiting for node 1 to be ready..."
      sleep 30
      
      echo "Starting test..."
      python3 /workspace/DeepEP/tests/test_internode.py \
        --num-tokens 512 \
        --hidden 1024 \
        --num-experts 16 \
        --num-topk 4
---
